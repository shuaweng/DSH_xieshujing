# Explicit Profile layer: default Web remains untouched; Novel Studio adds a
# selector-routed workbench surface, a safe proposal-only preset, and Novel services.
# Novel rows are an overlay appended after the Web bundle. The client-modules
# service snapshots Loader entries when it activates, so make both the roster
# builder and the Web readiness signal wait for the final Novel Studio marker.
- id: web-runtime
  inject: [webStartup, novelStudioPaths]

- id: modules
  inject: [novelStudioPaths]

- id: agent-presets
  inject: [novelStudioPaths]
  config:
    default: novel-workbench
    roots:
      - path: !!js ctx.novelStudioPaths.presetRoot
        trust: system
    includeUserRoot: true

- insert:
    - id: novel-asset-types
      name: '@deepseek-ai/dsh-experimental-novel-repository/asset-types'

    - id: novel-asset-outline
      name: '@deepseek-ai/dsh-experimental-novel-asset-outline'

    - id: novel-repository-local
      name: '@deepseek-ai/dsh-experimental-novel-repository-local'

    - id: novel-context
      name: '@deepseek-ai/dsh-experimental-novel-context'

    - id: novel-analysis
      name: '@deepseek-ai/dsh-experimental-novel-analysis'

    - id: novel-repository-remote
      name: '@deepseek-ai/dsh-experimental-novel-repository-remote'

    - id: novel-repository-client
      name: '@deepseek-ai/dsh-experimental-novel-repository-client'

    - id: novel-workbench
      name: '@deepseek-ai/dsh-experimental-novel-workbench'

    # Final marker: modules, web-runtime, and agent-presets wait for this
    # provider, so every Novel client row exists before the browser roster is
    # first composed.
    - id: novel-studio-paths
      name: '@deepseek-ai/dsh-experimental-novel-studio'
