# Optional profile-owned behavior for a dedicated writing application.
# The installable Novel Studio bundle stays neutral; this separate layer makes
# only unnamed sessions in an explicitly dedicated Profile start in its Preset.
- id: agent-presets
  config:
    default: novel-workbench
    includeShippedRoot: true
    includeUserRoot: true
    roots:
      - path: !!js >-
          process.getBuiltinModule('node:path').join(
            process.getBuiltinModule('node:path').dirname(
              process.getBuiltinModule('node:module').createRequire(baseUrl)
                .resolve('@deepseek-ai/dsh-experimental-novel-studio/package.json')
            ),
            'presets'
          )
        trust: system
